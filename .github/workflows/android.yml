name: Build Universal 32-Bit Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install Gradle and Generate Real Wrapper
      run: |
        sudo apt-get update
        sudo apt-get install gradle -y
        gradle wrapper --gradle-version 8.7

    - name: Grant Execute Permission for Generated Wrapper
      run: chmod +x gradlew

    - name: Build Universal Debug APK
      run: ./gradlew assembleDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: ping-pong-32bit
        path: app/build/outputs/apk/debug/app-debug.apk
